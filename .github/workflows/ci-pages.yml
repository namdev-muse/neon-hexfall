name: CI + Deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate game
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check game.js
      - name: Check smoke test
        run: node tests/smoke.js
      - name: Run auto-play bot harness
        run: node tests/bot.js
      - name: Check required files exist
        run: |
          test -f index.html
          test -f style.css
          test -f game.js
          test -f README.md
          test -f CONTRIBUTING.md
          test -f docs/screenshot-gameplay.png
          test -f docs/screenshot-menu.png
          test -f docs/gameplay.gif
          test -f .github/ISSUE_TEMPLATE/bug_report.md
          test -f .github/ISSUE_TEMPLATE/feature_request.md
          echo "All required files present."
      - name: Check no placeholder markers in shipped game
        run: |
          if grep -R "TODO\|FIXME" game.js index.html style.css; then
            echo "Found TODO/FIXME markers"
            exit 1
          fi
          echo "No placeholders found."

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  # Live-site smoke test (backlog #59): after every deploy, check the game
  # players actually get from GitHub Pages — HTTP 200 + current version on
  # index/game.js/style.css, then a headless-browser run (menu, PLAY, a
  # few hard drops, zero console errors). The script polls up to 3 minutes
  # for the new version, since Pages can lag the deploy.
  live-smoke:
    name: Live-site smoke test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Install headless Chromium
        run: npx playwright-core install chromium --only-shell --with-deps
      - name: Smoke-test the live site
        run: node tests/live-smoke.js
